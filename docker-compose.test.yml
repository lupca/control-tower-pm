version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ct_test
      POSTGRES_USER: ct
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ct -d ct_test"]
      interval: 5s
      timeout: 3s
      retries: 5
