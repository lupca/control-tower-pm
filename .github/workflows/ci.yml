name: Control Tower V2 CI Integration Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ct_test
          POSTGRES_USER: ct
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://ct:test@localhost:5432/ct_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run Integration & Unit Tests with Coverage
        env:
          DATABASE_URL: postgresql://ct:test@localhost:5432/ct_test
        run: |
          pytest backend/tests/ -v --cov=backend/app --cov-report=term-missing --cov-report=html
